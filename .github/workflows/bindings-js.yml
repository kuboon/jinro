name: JS Bindings Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  js-bindings:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install jco
        run: npm install -g @bytecodealliance/jco

      - name: Install JS binding dependencies
        run: cd bindings/js && npm install

      - name: Build JS bindings (componentize + transpile)
        run: cd bindings/js && npm run build

      - name: Run JS tests
        run: cd bindings/js && node test/test.js
