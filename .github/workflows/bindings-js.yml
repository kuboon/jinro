name: JS Bindings Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  js-bindings:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Build MoonBit WASM (wasm-gc)
        run: cd core && moon build --target wasm-gc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run JS tests
        run: |
          WASM=core/target/wasm-gc/release/build/jinro.wasm
          if [ ! -f "$WASM" ]; then
            echo "WASM file not found at $WASM; searching..."
            WASM=$(find core/target/wasm-gc -name "*.wasm" | grep -v test | head -1)
          fi
          echo "Using WASM: $WASM"
          node bindings/js/test/test.js "$WASM"
